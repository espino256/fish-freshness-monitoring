name: aqua_sense
description: "Mobile fish freshness monitoring with authenticated ESP32 telemetry."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  firebase_database: ^13.0.0
  firebase_storage: ^14.0.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  image: '>=4.10.0 <4.11.0'
  pdf: ^3.12.0
  printing: ^5.14.3
  csv: ^8.0.0
  share_plus: ^13.3.1
  flutter_svg: ^2.3.0
  intl: ^0.18.1
  http: ^1.6.0
  google_sign_in: ^7.2.0
  flutter_litert: 4.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/models/fish_freshness_model.tflite
    - assets/models/aquasense_gills_model.tflite
    - assets/models/aquasense_eyes_model.tflite
    - assets/models/aquasense_scales_model.tflite
    - assets/models/aquasense_scales_finetuned_model.tflite

  fonts:
    - family: AquaSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
